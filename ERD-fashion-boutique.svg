<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>text{font-family:Arial,sans-serif}.entity{fill:#fff;stroke:#1f8a70;stroke-width:2}.head{fill:#1f8a70}.title{fill:#fff;font-weight:bold;font-size:18px}.field{font-size:14px;fill:#20211f}.rel{stroke:#d7a84f;stroke-width:3;fill:none}.note{font-size:13px;fill:#555}</style>
  <text x="40" y="42" font-size="28" font-weight="bold">Inchangs Boutique ERD</text>
  <g transform="translate(55 90)"><rect class="entity" width="260" height="230" rx="8"/><rect class="head" width="260" height="42" rx="8"/><text class="title" x="18" y="27">users</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">name</text><text class="field" x="18" y="122">email unique</text><text class="field" x="18" y="148">password</text><text class="field" x="18" y="174">role admin/customer</text><text class="field" x="18" y="200">phone, address</text></g>
  <g transform="translate(470 90)"><rect class="entity" width="260" height="190" rx="8"/><rect class="head" width="260" height="42" rx="8"/><text class="title" x="18" y="27">categories</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">name unique</text><text class="field" x="18" y="122">description</text><text class="field" x="18" y="148">status</text></g>
  <g transform="translate(850 90)"><rect class="entity" width="280" height="270" rx="8"/><rect class="head" width="280" height="42" rx="8"/><text class="title" x="18" y="27">products</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">FK category_id</text><text class="field" x="18" y="122">name, sku unique</text><text class="field" x="18" y="148">description</text><text class="field" x="18" y="174">price, stock</text><text class="field" x="18" y="200">size, color, image_url</text><text class="field" x="18" y="226">status</text></g>
  <g transform="translate(55 430)"><rect class="entity" width="280" height="230" rx="8"/><rect class="head" width="280" height="42" rx="8"/><text class="title" x="18" y="27">orders</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">FK user_id</text><text class="field" x="18" y="122">order_number unique</text><text class="field" x="18" y="148">total, status</text><text class="field" x="18" y="174">shipping_address</text><text class="field" x="18" y="200">payment_method</text></g>
  <g transform="translate(470 430)"><rect class="entity" width="280" height="220" rx="8"/><rect class="head" width="280" height="42" rx="8"/><text class="title" x="18" y="27">order_items</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">FK order_id</text><text class="field" x="18" y="122">FK product_id</text><text class="field" x="18" y="148">quantity</text><text class="field" x="18" y="174">price, subtotal</text></g>
  <g transform="translate(850 460)"><rect class="entity" width="280" height="180" rx="8"/><rect class="head" width="280" height="42" rx="8"/><text class="title" x="18" y="27">activity_logs</text><text class="field" x="18" y="70">PK id</text><text class="field" x="18" y="96">FK user_id nullable</text><text class="field" x="18" y="122">action, table_name</text><text class="field" x="18" y="148">record_id, details</text></g>
  <path class="rel" d="M315 205 C390 205 390 525 55 525"/><text class="note" x="332" y="365">1 user to many orders</text><path class="rel" d="M730 185 C790 185 790 185 850 185"/><text class="note" x="752" y="170">1 category to many products</text><path class="rel" d="M335 545 C390 545 410 540 470 540"/><text class="note" x="360" y="522">1 order to many items</text><path class="rel" d="M750 535 C815 535 815 245 850 245"/><text class="note" x="770" y="395">1 product to many order items</text><path class="rel" d="M315 170 C650 170 650 550 850 550"/><text class="note" x="505" y="350">1 user to many activity logs</text>
